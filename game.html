<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="styles.css" rel="stylesheet">
    <link href="game.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/assets/images/objects/sandwich.png">

    <title>Juego | Hora del bocata</title>
</head>
<body>
    
    <div id="inventory-modal">
        <button id="close-inventory" class="close-modal">Cerrar</button>
        <h2 class="modal-title">Inventario</h2>
        <div id="inventory-list"></div>
        <span id="inventory-selected-item" class="selected-item-name"></span>
    </div>

    <div id="dialog-modal" style="display: none;">
        <h1 id="dialog-interlocutorName"></h1>
        <p id="dialog-text" data-textIndex=""></p>
        <p id="dialog-E">E</p>
    </div>

    <div id="help-modal" style="display: none;">
        <button class="close-modal" id="close-help">Cerrar</button>
        <h2>Ayuda</h2>
        <div id="imagenesFlechasWasd">
            <div id="help-wasd">
                <img src="/assets/images/help_wasd_dark.png" alt="WASD Controls">
                <p>Caminar</p>
            </div>
            <div id="help-flechas">
                <img src="/assets/images/help_wasd_dark.png" alt="WASD Controls">
                <p>Movimiento interfaz </p>
            </div>
        </div>
        <div id="help-e">
            <img src="/assets/images/help_e_dark.png" alt="E Controls">
            <p>Interactuar</p>
        </div>
        <div id="help-m">
            <img src="/assets/images/help_m_dark.png" alt="M Controls">
            <p>Abrir/Cerrar Mapa</p>
        </div>
        <div id="help-i">
            <img src="/assets/images/help_i_dark.png" alt="I Controls">
            <p>Abrir/Cerrar Inventario</p>
        </div>
        <div id="help-h">
            <img src="/assets/images/help_h_dark.png" alt="H Controls">
            <p>Abrir/Cerrar Ayuda</p>
        </div>
        <div id="help-p">
            <img src="/assets/images/help_p_dark.png" alt="P Controls">
            <p>Pausar/Despausar Música</p>
        </div>

    </div>

    <div id="inventory-notification">
        <p id="inventory-notification-text"></p>
    </div>

    <div id="cooking-modal">
        <button id="close-cooking" class="close-modal">Cerrar</button>
        <h2 class="modal-title">Cocinar</h2>
        <div id="cooking-container">
            <div id="cooking-list"></div>
            <button id="cook-button" class="cooking-cell lockedItem"><img src="/assets/images/objects/sandwich.png" id="Bocata supremo"></button>
            <span id="cooking-selected-item" class="selected-item-name"></span>
        </div>
    </div>

    <div id="game">
        <script src="phaser.min.js"></script>
        <script type="module" src="./game.js"></script> 
    </div>

    
    <!-- Música de fondo -->
    <audio id="bg-music" src="./assets/sounds/background_music_edit.mp3" loop></audio>

    <!-- Nuevo: sonido de victoria -->
    <audio id="victory-sound" src="./assets/sounds/win_sound.mp3"></audio>

    <div id="buttons">
        <button class="iconButton soundOn" id="mute-button"></button>
        <button class="iconButton" id="open-help"></button>
    </div>

</body>
</html>
