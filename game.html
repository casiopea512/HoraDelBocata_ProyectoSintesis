<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="styles.css" rel="stylesheet">
    <link href="game.css" rel="stylesheet">

    <title>Hora del bocata</title>
</head>
<body>

    <button id="open-help">?</button>
    
    <div id="inventory-modal">
        <button id="close-inventory">Cerrar</button>
        <h2>Inventario</h2>
        <div id="inventory-list"></div>
        <span id="inventory-selected-item"></span>
    </div>

    <div id="dialog-modal" style="display: none;">
        <h1 id="dialog-interlocutorName"></h1>
        <p id="dialog-text" data-textIndex=""></p>
        <p id="dialog-E">E</p>
    </div>

    <div id="help-modal" style="display: none;">
        <button id="close-help">X</button>
        <h2>Ayuda</h2>
        <div id="help-wasd">
            <img src="/assets/images/help_wasd.png" alt="WASD Controls">
            <p>Caminar</p>
        </div>
        <div id="help-e">
            <img src="/assets/images/help_e.png" alt="E Controls">
            <p>Interactuar</p>
        </div>
        <div id="help-m">
            <img src="/assets/images/help_m.png" alt="M Controls">
            <p>Abrir/Cerrar Mapa</p>
        </div>
        <div id="help-i">
            <img src="/assets/images/help_i.png" alt="I Controls">
            <p>Abrir/Cerrar Inventario</p>
        </div>
        <div id="help-h">
            <img src="/assets/images/help_h.png" alt="H Controls">
            <p>Abrir/Cerrar Ayuda</p>
        </div>

    </div>

    <div id="inventory-notification" style="display: none;">
        <p id="inventory-notification-text"></p>
    </div>

    <div id="cooking-modal">
        <button id="close-cooking">Cerrar</button>
        <h2>Cocinar</h2>
        <div id="cooking-container">
            <div id="cooking-list"></div>
            <button id="cook-button" class="cooking-cell lockedItem"><img src="/assets/images/objects/sandwich.png"></button>
            <span id="cooking-selected-item"></span>
        </div>
    </div>

    <div id="game">
        <script src="phaser.min.js"></script>
        <script type="module" src="./game.js"></script> 
    </div>

</body>
</html>
